[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
rustflags = [
    # 커널 드라이버 링커 플래그
    "-C", "link-arg=/DRIVER",
    "-C", "link-arg=/SUBSYSTEM:NATIVE",
    "-C", "link-arg=/NODEFAULTLIB",
    "-C", "link-arg=/ENTRY:DriverEntry",
    "-C", "link-arg=/MERGE:.rdata=.text",
    # /INTEGRITYCHECK requires the binary to be signed with page hashes
    # (signtool /ph), which we don't do; without them the OS loader rejects
    # the image outright. Not required for an ordinary WDM driver, so drop it
    # rather than switch the signing step to page-hash mode.
    # static CRT — 커널 드라이버 필수 (/MT)
    "-C", "target-feature=+crt-static",
]
