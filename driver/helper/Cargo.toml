# NOTE: `cargo build`/`cargo run` in this directory will fail to link
# ("unresolved external symbol DriverEntry" etc.) unless RUSTFLAGS is set to
# a non-empty no-op value first, e.g. in PowerShell: `$env:RUSTFLAGS = " "`
# (a literal "" does not work — Windows treats an env var assigned "" as
# unset rather than defined-but-empty). ../.cargo/config.toml sets
# kernel-driver linker flags for the WDM driver crate one level up, and
# cargo's config discovery merges array-typed keys like rustflags across
# every ancestor config file it finds rather than letting a closer file (or
# even a --config CLI override) replace them — only a real RUSTFLAGS env var
# wins outright over config-file rustflags. `cargo check` is unaffected
# since it does not invoke the linker. See driver/scripts/build-and-sign.ps1
# for the scripted build, which already does this.

[package]
name = "wuma-tracker-helper"
version = "0.1.0"
edition = "2021"
description = "Privileged helper that owns the WumaDisplayService driver handle and exposes a single get-location IPC operation."

[[bin]]
name = "wuma_tracker_helper"
path = "src/main.rs"

[dependencies]
winapi = { version = "0.3.9", features = [
    "fileapi",
    "handleapi",
    "ioapiset",
    "namedpipeapi",
    "securitybaseapi",
    "processthreadsapi",
    "winnt",
    "minwindef",
    "winerror",
    "wintrust",
    "softpub",
    "winbase",
    "errhandlingapi",
    "guiddef",
    "minwinbase",
] }
