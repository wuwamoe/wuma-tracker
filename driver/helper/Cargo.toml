[package]
name = "wuma-tracker-helper"
version = "0.1.0"
edition = "2021"
description = "Privileged helper that owns the WumaDisplayService driver handle and exposes a single get-location IPC operation."

[[bin]]
name = "wuma_tracker_helper"
path = "src/main.rs"

[dependencies]
winapi = { version = "0.3.9", features = [
    "fileapi",
    "handleapi",
    "ioapiset",
    "namedpipeapi",
    "securitybaseapi",
    "processthreadsapi",
    "winnt",
    "minwindef",
    "winerror",
    "wintrust",
    "softpub",
    "winbase",
    "errhandlingapi",
    "guiddef",
    "minwinbase",
] }
