name: "publish"

on:
  push:
    branches:
      - release

# tauri-action을 쓰지 않고 직접 빌드/릴리스한다.
#   - Windows: WPF 설치 프로그램(installer/WumaTracker.Setup) 하나만 빌드한다 —
#     WiX/MSI는 CI에서 더 이상 안 만듦 (build-msi.ps1/wix7은 로컬/수동용으로만 남음).
#     signtool(Authenticode) 코드 서명도 현재 CI에서 비활성화 — EV(SimplySign)
#     인증서가 필요한 self-hosted 러너 의존성 없이 빌드하기 위함. 결과물은 코드
#     서명 없이 나간다. 업데이트 무결성 서명(.sig, tauri signer)은 별개 메커니즘이라
#     그대로 유지 — 이게 없으면 tauri-plugin-updater 자체가 작동하지 않는다.
#   - macOS: 기존과 동일하게 ad-hoc 서명, 업데이터 아티팩트 미생성.
#   - latest.json은 scripts/build-latest-json.mjs로 직접 조립한다 (Windows에만 자동 업데이트 제공).

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: install frontend dependencies
        shell: pwsh
        run: bun install

      # WiX/MSI is not built in CI anymore — the WPF installer
      # (installer/WumaTracker.Setup) replaces it as the shipped Windows
      # installer. build-msi.ps1/wix7 still exist for local/manual MSI
      # builds if ever needed, just not wired into this pipeline.
      #
      # The installer's UI is a WPF app, replacing Tauri's own NSIS bundler
      # entirely too — see specs/0005-wpf-installer.md in the wuma-base
      # workspace for why (nsDialogs couldn't reach the wizard chrome;
      # Tauri's nsis.template override hits tauri-apps/tauri#10850).
      # -SkipSign: no signtool/Authenticode signing in CI right now (see the
      # note at the top of this file) — ships unsigned. Builds the app
      # binary + frontend (tauri build --no-bundle) as its own first step,
      # since there's no earlier MSI step to reuse a build from anymore.
      - name: build installer (WPF)
        shell: pwsh
        run: ./build-installer.ps1 -SkipSign

      - name: sign installer (updater signature only)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WUMA_TRACKER_SIGN_SECRET }}
          # Explicit empty string, not just omitted: tauri-cli's secret_key()
          # prompts interactively whenever this is unset (even for a
          # password-less key) — see minisign::SecretKeyBox::into_secret_key.
          # Hangs forever in non-interactive CI otherwise. Confirmed by
          # reproducing the hang locally and reading tauri-cli's source
          # (crates/tauri-cli/src/helpers/updater_signature.rs).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          bun run tauri signer sign $setup

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          # dist/* would also sweep up dist/installer-publish/ — the
          # intermediate `dotnet publish` output dir build-installer.ps1
          # leaves behind alongside the actual *-setup.exe it copies out of
          # it. The release job's `gh release upload` chokes trying to
          # upload a directory as an asset ("is a directory"), so exclude
          # it here instead of filtering assets later.
          path: |
            dist/*
            !dist/installer-publish/**
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: bun install

      - name: build (ad-hoc signed, no updater artifacts)
        run: >-
          bun run tauri build
          --target universal-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: build latest.json
        run: node scripts/build-latest-json.mjs artifacts/windows-bundle

      - name: read version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: create/update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          ASSETS=(artifacts/windows-bundle/* artifacts/macos-bundle/* latest.json)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title "App v${{ steps.version.outputs.version }}" \
              --notes-file .github/release-notes.md \
              --draft
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$REPO" \
              --title "App v${{ steps.version.outputs.version }}" \
              --notes-file .github/release-notes.md \
              --draft
          fi
