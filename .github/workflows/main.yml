name: "publish"

on:
  push:
    branches:
      - release

# tauri-action을 쓰지 않고 직접 빌드/서명/릴리스한다.
#   - Windows: EV(SimplySign) 인증서로 signtool 서명이 필요해서 self-hosted 러너에서 빌드한다
#     (SimplySign CSP는 클라우드 HSM 프록시라 해당 러너에 SimplySign Desktop이 인증되어 있어야 함).
#   - macOS: 기존과 동일하게 ad-hoc 서명, 업데이터 아티팩트 미생성.
#   - latest.json은 scripts/build-latest-json.mjs로 직접 조립한다 (Windows에만 자동 업데이트 제공).

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: bun install

      - name: install WiX v7
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext -g

      # MSI is packaged directly with WiX v7 (see build-msi.ps1 / sign-msi.ps1 at repo root)
      # instead of tauri-bundler's bundled WiX v3 toolchain. This also builds the app
      # binary + frontend (tauri build --no-bundle) as its first step.
      - name: build MSI (WiX v7)
        shell: pwsh
        run: ./build-msi.ps1

      - name: sign MSI (signtool)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WUMA_TRACKER_SIGN_SECRET }}
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1 -ExpandProperty FullName
          ./sign-msi.ps1 -MsiPath $msi

      - name: build NSIS installer (signed)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WUMA_TRACKER_SIGN_SECRET }}
        run: bun run tauri build --bundles nsis

      - name: collect bundle
        shell: bash
        run: |
          set -eu
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          cp src-tauri/target/release/bundle/nsis/*.exe.sig dist/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: bun install

      - name: build (ad-hoc signed, no updater artifacts)
        run: >-
          bun run tauri build
          --target universal-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: build latest.json
        run: node scripts/build-latest-json.mjs artifacts/windows-bundle

      - name: read version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: create/update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          ASSETS=(artifacts/windows-bundle/* artifacts/macos-bundle/* latest.json)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title "App v${{ steps.version.outputs.version }}" \
              --notes-file .github/release-notes.md \
              --draft
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$REPO" \
              --title "App v${{ steps.version.outputs.version }}" \
              --notes-file .github/release-notes.md \
              --draft
          fi
