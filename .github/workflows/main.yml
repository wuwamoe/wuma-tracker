name: "publish"

on:
  push:
    branches:
      - release

# tauri-action을 쓰지 않고 직접 빌드/릴리스한다.
#   - Windows: signtool(Authenticode) 코드 서명은 현재 CI에서 비활성화 — EV(SimplySign)
#     인증서가 필요한 self-hosted 러너 의존성 없이 빌드하기 위함. 결과물(msi/설치
#     프로그램)은 코드 서명 없이 나간다. 업데이트 무결성 서명(.sig, tauri signer)은
#     별개 메커니즘이라 그대로 유지 — 이게 없으면 tauri-plugin-updater 자체가
#     작동하지 않는다.
#   - macOS: 기존과 동일하게 ad-hoc 서명, 업데이터 아티팩트 미생성.
#   - latest.json은 scripts/build-latest-json.mjs로 직접 조립한다 (Windows에만 자동 업데이트 제공).

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: install frontend dependencies
        shell: pwsh
        run: bun install

      - name: install WiX v7
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          wix extension add WixToolset.UI.wixext -g

      # MSI is packaged directly with WiX v7 (see build-msi.ps1 at repo root)
      # instead of tauri-bundler's bundled WiX v3 toolchain. This also builds the app
      # binary + frontend (tauri build --no-bundle) as its first step.
      # -SkipSign: no signtool/Authenticode signing in CI right now (see the
      # note at the top of this file) — ships unsigned.
      - name: build MSI (WiX v7)
        shell: pwsh
        run: ./build-msi.ps1 -SkipSign

      - name: sign MSI (updater signature only)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WUMA_TRACKER_SIGN_SECRET }}
        run: |
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1 -ExpandProperty FullName
          bun run tauri signer sign $msi

      # The installer's UI is a WPF app (installer/WumaTracker.Setup),
      # replacing Tauri's own NSIS bundler entirely — see
      # specs/0005-wpf-installer.md in the wuma-base workspace for why
      # (nsDialogs couldn't reach the wizard chrome; Tauri's nsis.template
      # override hits tauri-apps/tauri#10850). -SkipAppBuild because the
      # MSI step above already built the shared wuma-tracker.exe this reuses
      # (-SkipSign is implicit there too — nothing signed it in the first place).
      - name: build installer (WPF)
        shell: pwsh
        run: ./build-installer.ps1 -SkipAppBuild -SkipSign

      - name: sign installer (updater signature only)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.WUMA_TRACKER_SIGN_SECRET }}
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1 -ExpandProperty FullName
          bun run tauri signer sign $setup

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: dist/*
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "aarch64-apple-darwin,x86_64-apple-darwin"

      - name: install bun
        uses: oven-sh/setup-bun@v2

      - name: install frontend dependencies
        run: bun install

      - name: build (ad-hoc signed, no updater artifacts)
        run: >-
          bun run tauri build
          --target universal-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: build latest.json
        run: node scripts/build-latest-json.mjs artifacts/windows-bundle

      - name: read version
        id: version
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: create/update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"
          ASSETS=(artifacts/windows-bundle/* artifacts/macos-bundle/* latest.json)

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title "App v${{ steps.version.outputs.version }}" \
              --notes-file .github/release-notes.md \
              --draft
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$REPO" \
              --title "App v${{ steps.version.outputs.version }}" \
              --notes-file .github/release-notes.md \
              --draft
          fi
